name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck backend
        run: pnpm typecheck

      - name: Typecheck frontend
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: pnpm run typecheck

      - name: Test frontend
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: pnpm run test

      - name: Build frontend
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: pnpm run build

  backend-test:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: worldbook
          POSTGRES_PASSWORD: worldbook
          POSTGRES_DB: worldbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldbook -d worldbook"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://worldbook:worldbook@127.0.0.1:5432/worldbook
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm migrate

      - name: Test backend
        run: pnpm test
